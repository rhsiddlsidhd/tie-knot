name: Static Validation

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:barrels

  tsc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run tsc

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/tie-knot-build
          JWT_SECRET: static-ci-jwt-secret-at-least-thirty-two-characters
          ENTRY_JWT_SECRET: static-ci-entry-secret-at-least-thirty-two-characters
          PORTONE_API_SECRET: test-secret
          NEXT_PUBLIC_PORTONE_STORE_ID: store-ci
          NEXT_PUBLIC_PORTONE_CHANNEL_KEY: channel-ci
          NEXT_PUBLIC_KAKAO_MAP_API_KEY: kakao-map-ci
          BASE_URL: http://127.0.0.1:3100
          DEPLOYMENT_BASE_URL: http://127.0.0.1:3100

  # lint/tsc/build를 병렬로 돌리는 대신, 브랜치 보호가 요구하는 required status check
  # 이름("static" 하나, docs/validation/ci-gates.md)은 이 취합 job으로 고정한다 — job을
  # 여러 개로 쪼개도 GitHub 브랜치 보호 설정을 매번 동기화할 필요가 없다.
  static:
    needs: [lint, tsc, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check parallel job results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.tsc.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "lint=${{ needs.lint.result }} tsc=${{ needs.tsc.result }} build=${{ needs.build.result }}"
            exit 1
          fi
